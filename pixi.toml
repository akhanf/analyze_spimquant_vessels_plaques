[workspace]
authors = ["Ali Khan <alik@robarts.ca>"]
channels = ["conda-forge", "bioconda"]
name = "analyze_spimquant"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
run_workflow = { cmd = "snakemake --cores all" }

[dependencies]
snakemake-minimal = ">=9.0,<10"
matplotlib = ">=3.10.8,<4"
pandas = ">=3.0.1,<4"
pyarrow = ">=23.0.1,<24"
seaborn = ">=0.13.2,<0.14"
scipy = ">=1.15,<2"
statsmodels = ">=0.14,<1"
nibabel = ">=5.0,<6"
