[workspace]
authors = ["Ali Khan <alik@robarts.ca>"]
channels = ["conda-forge"]
name = "analyze_spimquant"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
run_notebooks = { cmd = "jupyter nbconvert --to notebook --execute --inplace import_data.ipynb regional_dataframe.ipynb regional_analysis.ipynb treatment_effect_analysis.ipynb vessel_spatial_analysis.ipynb" }

[dependencies]
jupyterlab = ">=4.5.6,<5"
matplotlib = ">=3.10.8,<4"
pandas = ">=3.0.1,<4"
pyarrow = ">=23.0.1,<24"
seaborn = ">=0.13.2,<0.14"
scipy = ">=1.15,<2"
statsmodels = ">=0.14,<1"
nibabel = ">=5.0,<6"
